site_name: BMS Pet Project — Documentation
site_description: Учебный проект по интеграции систем кондиционирования в единую BMS
site_author: Александр Никитин
site_url: https://<твой-username>.github.io/bms-pet-project/

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

nav:
  - Главная: index.md
  - 01. Требования:
      - FDS (Functional Design Spec): 01-requirements/fds.md
      - Points Schedule: 01-requirements/point-schedule.md
  - 02. Архитектура:
      - Сетевая архитектура: 02-architecture/network.md
      - Потоки данных: 02-architecture/data-flow.md
  - 03. API:
      - Спецификация API: 03-api/openapi.md
  - 04. Пусконаладка:
      - План тестирования: 04-commissioning/test-plan.md